<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#05070d"/>
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="#00e5ff" stroke-opacity="0.45" stroke-width="2"/>
  <!-- Blue light trail turning up, red trail turning down: two riders mid-duel -->
  <g filter="url(#glow)" fill="none" stroke-linecap="square" stroke-width="5">
    <path d="M10 40 H26 V16" stroke="#448AFF"/>
    <path d="M54 26 H38 V48" stroke="#FF5252"/>
  </g>
  <rect x="23" y="12" width="6" height="6" fill="#ffffff"/>
  <rect x="35" y="46" width="6" height="6" fill="#ffffff"/>
</svg>
